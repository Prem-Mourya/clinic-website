<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f7b75" />

    <!-- Primary SEO -->
    <title>Usha Clinic — Trusted General Physician & Family Healthcare</title>
    <meta name="description" content="Personalized medical care by a qualified general physician. Book appointments easily, consult on fever, diabetes, BP, preventive checkups and seasonal illness. Walk-ins welcome." />
    <meta name="keywords" content="general physician, family doctor, clinic, appointment booking, doctor consultation, healthcare" />
    <meta name="author" content="Usha Clinic" />
    <link rel="canonical" href="https://example.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Usha Clinic — Trusted General Physician & Family Healthcare" />
    <meta property="og:description" content="Personalized medical care by a qualified general physician. Book appointments easily via WhatsApp." />
    <meta property="og:image" content="/images/clinic-interior.jpg" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Usha Clinic — Trusted General Physician & Family Healthcare" />
    <meta name="twitter:description" content="Personalized medical care by a qualified general physician. Book appointments easily via WhatsApp." />
    <meta name="twitter:image" content="/images/clinic-interior.jpg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Structured data: MedicalClinic -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MedicalClinic",
        "name": "Usha Clinic",
        "medicalSpecialty": "GeneralPractice",
        "image": "/images/clinic-interior.jpg",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "123 Main Road, Near City Park",
          "addressLocality": "Bengaluru",
          "addressRegion": "Karnataka",
          "postalCode": "560001",
          "addressCountry": "IN"
        },
        "telephone": "+91-98765-43210",
        "openingHours": "Mo-Sa 09:00-13:00, Mo-Sa 17:00-21:00",
        "priceRange": "$$"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
